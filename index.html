<script type="text/babel" data-presets="env,react">
const { useRef, useEffect, useState, useLayoutEffect, useMemo } = React;
const { motion, useScroll, useTransform, useMotionValueEvent } = window.framerMotion || window.Motion || {};
const fm = window.framerMotion || window.Motion;
const M = fm.motion;
const useScrollHook = fm.useScroll;
const useTransformHook = fm.useTransform;

/* ─── FadeIn ─────────────────────────────────────────────── */
function FadeIn({ as = 'div', children, delay = 0, duration = 0.7, x = 0, y = 30, className = '', style = {}, ...rest }) {
  const Comp = M[as] || M.div;
  return (
    <Comp
      initial={{ opacity: 0, x, y }}
      whileInView={{ opacity: 1, x: 0, y: 0 }}
      viewport={{ once: true, margin: '50px', amount: 0 }}
      transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
      className={className}
      style={style}
      {...rest}
    >
      {children}
    </Comp>
  );
}

/* ─── Magnet ─────────────────────────────────────────────── */
function Magnet({ children, padding = 100, strength = 3 }) {
  const ref = useRef(null);
  const [t, setT] = useState({ x: 0, y: 0 });
  const [active, setActive] = useState(false);

  useEffect(() => {
    const onMove = (e) => {
      const el = ref.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      const inside = Math.abs(dx) < r.width / 2 + padding && Math.abs(dy) < r.height / 2 + padding;
      setActive(inside);
      setT(inside ? { x: dx / strength, y: dy / strength } : { x: 0, y: 0 });
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [padding, strength]);

  return (
    <div
      ref={ref}
      style={{
        transform: `translate3d(${t.x}px,${t.y}px,0)`,
        transition: active ? 'transform 0.3s ease-out' : 'transform 0.6s ease-in-out',
        willChange: 'transform'
      }}
    >
      {children}
    </div>
  );
}

/* ─── AnimatedText ───────────────────────────────────────── */
function AnimatedText({ text, className = '', style = {} }) {
  const ref = useRef(null);
  const { scrollYProgress } = useScrollHook({ target: ref, offset: ['start 0.8', 'end 0.2'] });
  const chars = useMemo(() => Array.from(text), [text]);
  return (
    <p ref={ref} className={className} style={style}>
      {chars.map((ch, i) => {
        const start = i / chars.length, end = (i + 1) / chars.length;
        const opacity = useTransformHook(scrollYProgress, [start, end], [0.18, 1]);
        return (
          <span key={i} style={{ position: 'relative', display: 'inline' }}>
            <span style={{ opacity: 0 }}>{ch}</span>
            <M.span style={{ position: 'absolute', left: 0, top: 0, opacity }}>{ch}</M.span>
          </span>
        );
      })}
    </p>
  );
}

function MarqueeSection() {
  const sectionRef = useRef(null);
  const [offset, setOffset] = useState(0);

  useEffect(() => {
    const onScroll = () => {
      const el = sectionRef.current;
      if (!el) return;
      const top = el.getBoundingClientRect().top + window.scrollY;
      setOffset((window.scrollY - top + window.innerHeight) * 0.3);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, []);

  const row1 = MARQUEE_URLS.slice(0, 11);
  const row2 = MARQUEE_URLS.slice(11);
  const triple = (arr) => [...arr, ...arr, ...arr];
  const tile = { width: '420px', height: '270px', flex: '0 0 auto' };

  return (
    <section ref={sectionRef} className="pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden" style={{ background: '#0C0C0C' }}>
      <div className="flex flex-col gap-3">
        <div className="flex gap-3" style={{ transform: `translateX(${offset - 200}px)`, willChange: 'transform' }}>
          {triple(row1).map((src, i) => <img key={`r1-${i}`} src={src} loading="lazy" alt="" className="rounded-2xl object-cover" style={tile} />)}
        </div>
        <div className="flex gap-3" style={{ transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' }}>
          {triple(row2).map((src, i) => <img key={`r2-${i}`} src={src} loading="lazy" alt="" className="rounded-2xl object-cover" style={tile} />)}
        </div>
      </div>

}

/* Gracefully renders an image or a clean dark placeholder */
function ProjectImage({ src }) {
  const [err, setErr] = useState(false);
  const empty = !src || src.trim() === '' || err;
  return (
    <div className="w-full h-full relative overflow-hidden" style={{ borderRadius: 'inherit' }}>
      {/* Always-present dark bg — visible as placeholder when no image */}
      <div
        className="absolute inset-0"
        style={{ background: 'linear-gradient(135deg, #0f0f18 0%, #15151f 100%)', borderRadius: 'inherit' }}
      />
      {/* Subtle dot pattern overlay when empty */}
      {empty && (
        <div
          className="absolute inset-0 flex items-center justify-center"
          style={{
            backgroundImage: 'radial-gradient(circle, rgba(215,226,234,0.06) 1px, transparent 1px)',
            backgroundSize: '22px 22px',
            borderRadius: 'inherit'
          }}
        />
      )}
      {!empty && (
        <img
          src={src}
          alt=""
          loading="lazy"
          className="absolute inset-0 w-full h-full object-cover"
          style={{ borderRadius: 'inherit' }}
          onError={() => setErr(true)}
        />
      )}
    </div>
  );
}

function ProjectCard({ project, index, total, progress, range }) {
  const targetScale = 1 - (total - 1 - index) * 0.025;
  const scale = useTransformHook(progress, range, [1, targetScale]);

  return (
    // Each card is slightly shorter than the previous so stacking doesn't exceed
    // the section and blurbs can't bleed below the next card.
    <div
      className="sticky"
      style={{ top: `calc(4.5rem + ${index * 22}px)`, height: `calc(88vh - ${index * 11}px)` }}
    >
      <M.div style={{ scale, transformOrigin: 'top center' }} className="h-full">
        {/* overflow-hidden ensures NOTHING bleeds out of this card's boundary */}
        <div
          className="h-full rounded-[28px] md:rounded-[34px] overflow-hidden flex flex-col md:flex-row"
          style={{ background: '#0D0D14', border: '1.5px solid rgba(215,226,234,0.16)' }}
        >
          {/* ── LEFT: info panel ─────────────────────────── */}
          <div
            className="flex flex-col justify-between px-6 py-6 sm:px-8 sm:py-8 md:px-10 md:py-10 shrink-0 md:w-[36%]"
            style={{ borderBottom: '1px solid rgba(215,226,234,0.09)', borderRight: 'none' }}
          >
            {/* Top: number + tag + name + blurb */}
            <div className="flex flex-col gap-3 md:gap-4">
              <div className="font-black leading-none hero-heading" style={{ fontSize: 'clamp(2.4rem, 6vw, 86px)' }}>
                {project.n}
              </div>
              <div>
                <div className="uppercase tracking-[0.2em] font-light mb-1" style={{ color: '#D7E2EA', opacity: 0.4, fontSize: 'clamp(0.6rem, 0.85vw, 0.75rem)' }}>
                  {project.tag}
                </div>
                <div className="font-bold uppercase leading-none" style={{ color: '#D7E2EA', fontSize: 'clamp(1.5rem, 2.6vw, 2.8rem)' }}>
                  {project.name}
                </div>
              </div>
              <p className="font-light leading-relaxed" style={{ color: '#D7E2EA', opacity: 0.55, fontSize: 'clamp(0.76rem, 1vw, 0.9rem)', maxWidth: '340px' }}>
                {project.blurb}
              </p>
            </div>
            {/* Bottom: button */}
            <div className="mt-5 md:mt-0">
              <LiveProjectButton href={project.href} />
            </div>
          </div>

          {/* ── RIGHT: image grid ─────────────────────────── */}
          {/* 2-col × 2-row; img3 spans full right column height */}
          <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-2 p-3 md:p-4" style={{ minHeight: 0 }}>
            <div className="col-start-1 row-start-1 rounded-[14px] md:rounded-[18px] overflow-hidden">
              <ProjectImage src={project.img1} />
            </div>
            <div className="col-start-2 row-start-1 row-span-2 rounded-[14px] md:rounded-[18px] overflow-hidden">
              <ProjectImage src={project.img3} />
            </div>
            <div className="col-start-1 row-start-2 rounded-[14px] md:rounded-[18px] overflow-hidden">
              <ProjectImage src={project.img2} />
            </div>
          </div>
        </div>
      </M.div>
    </div>
  );
}

function ProjectsSection() {
  const containerRef = useRef(null);
  const { scrollYProgress } = useScrollHook({ target: containerRef, offset: ['start start', 'end end'] });
  const total = PROJECTS.length;
  return (
    <section
      id="projects"
      ref={containerRef}
      className="rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 relative z-10 px-4 sm:px-6 md:px-8 pt-20 sm:pt-24 md:pt-32 pb-40"
      style={{ background: '#0C0C0C' }}
    >
      <FadeIn as="h2" y={40} className="hero-heading font-black uppercase leading-none tracking-tight text-center mb-14 sm:mb-20 md:mb-24" style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
        Projects
      </FadeIn>
      <div className="max-w-7xl mx-auto">
        {PROJECTS.map((p, i) => (
          <ProjectCard
            key={p.n}
            project={p}
            index={i}
            total={total}
            progress={scrollYProgress}
            range={[i / total, (i + 1) / total]}
          />
        ))}
      </div>
    </section>
  );
}
