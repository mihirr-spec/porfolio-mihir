  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- accent glows -->
  <circle cx="180" cy="180" r="220" fill="#6366f1" opacity="0.12"/>
  <circle cx="1050" cy="480" r="180" fill="#8b5cf6" opacity="0.10"/>
  <!-- name -->
  <text x="80" y="260" font-family="sans-serif" font-weight="900" font-size="96" fill="#ffffff" letter-spacing="-2">Mihir Sanghvi</text>
  <!-- role -->
  <text x="84" y="330" font-family="sans-serif" font-weight="400" font-size="36" fill="#ffffff" opacity="0.55">Full-Stack &amp; AI Developer</text>
  <!-- tags -->
  <rect x="84" y="380" width="130" height="40" rx="20" fill="#ffffff" opacity="0.08"/>
  <text x="149" y="406" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle">React</text>
  <rect x="228" y="380" width="165" height="40" rx="20" fill="#ffffff" opacity="0.08"/>
  <text x="310" y="406" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle">TypeScript</text>
  <rect x="407" y="380" width="120" height="40" rx="20" fill="#ffffff" opacity="0.08"/>
  <text x="467" y="406" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle">Python</text>
  <rect x="541" y="380" width="120" height="40" rx="20" fill="#ffffff" opacity="0.08"/>
  <text x="601" y="406" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle">FastAPI</text>
  <rect x="675" y="380" width="80" height="40" rx="20" fill="#ffffff" opacity="0.08"/>
  <text x="715" y="406" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle">AI/ML</text>
  <!-- domain -->
  <text x="84" y="560" font-family="sans-serif" font-size="22" fill="#ffffff" opacity="0.3">mihirsanghvi.dev</text>
